
services:
  servicehub:
    build: .
    ports:
      - "${SERVICEHUB_HOST_PORT:-8000}:8000"
    environment:
      SERVICEHUB_HOST: 0.0.0.0
      SERVICEHUB_PORT: 8000
      SERVICEHUB_DB_PATH: /data/servicehub.db
      SERVICEHUB_ADMIN_EMAIL: ${SERVICEHUB_ADMIN_EMAIL:-}
      SERVICEHUB_ADMIN_PASSWORD: ${SERVICEHUB_ADMIN_PASSWORD:-}

      # Cấu hình xác thực email OTP
      SERVICEHUB_OTP_SECRET: ${SERVICEHUB_OTP_SECRET:-}
      SERVICEHUB_SMTP_EMAIL: ${SERVICEHUB_SMTP_EMAIL:-}
      SERVICEHUB_SMTP_PASSWORD: ${SERVICEHUB_SMTP_PASSWORD:-}

    volumes:
      - servicehub_data:/data
      - servicehub_uploads:/app/static/uploads
    restart: unless-stopped

volumes:
  servicehub_data:
  servicehub_uploads:
